name: const_grad
seeds: [42, 43, 44]
output_dir: results/const_grad
runtime:
  device: auto
  precision: float32
  deterministic: true
  num_threads: 1
domain:
  bounds: [[0.0, 2.0], [0.0, 2.0], [0.0, 2.0]]
  source: [1.0, 1.0, 1.0]
velocity:
  kind: constant_gradient
  v0: 2.0
  gradient: [0.0, 0.0, 0.5]
network:
  hidden_layers: 10
  width: 20
  activation: adaptive_atan
  activation_scale: 10.0
  fourier: {enabled: false, size: 32, scale: 1.0, include_raw: true}
loss:
  eps: 1.0e-8
  weights: {pde: 1.0, positivity: 1.0, source: 1.0}
  adaptive: {enabled: true, update_every: 50, beta: 0.9, min_weight: 0.001, max_weight: 1000.0}
training:
  iterations: 20000
  batch_size: 2048
  lr: 0.001
  lr_min: 0.00001
  schedule: cosine
  log_every: 100
  eval_every: 500
  checkpoint_every: 2000
  source_batch_size: 16
  lbfgs: {enabled: false, iterations: 50, max_iter: 20, batch_size: 8192, lr: 1.0, history_size: 50}
evaluation:
  grid_size: 51
  validation_grid_size: 21
  batch_size: 65536
  thresholds: [0.01, 0.001]
  reference: auto
  refinement: 2
  save_field: true
  plots: true
fsm: {tolerance: 1.0e-8, max_cycles: 100, backend: numba}
