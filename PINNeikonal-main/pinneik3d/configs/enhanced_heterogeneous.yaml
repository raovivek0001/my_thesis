extends: heterogeneous.yaml
name: enhanced_heterogeneous
output_dir: results/enhanced_heterogeneous
network:
  hidden_layers: 6
  width: 64
  fourier: {enabled: true, size: 32, scale: 0.25, include_raw: true}
loss:
  residual_normalization: relative
training:
  select_best: true
  gradient_clip: 5.0
  sampling: {enabled: true, warmup: 250, update_every: 50, candidate_multiplier: 4, uniform_fraction: 0.5}
