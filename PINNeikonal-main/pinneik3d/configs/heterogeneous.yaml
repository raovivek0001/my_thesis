extends: base.yaml
name: heterogeneous
output_dir: results/heterogeneous
velocity:
  kind: heterogeneous
  v0: 2.0
  gradient: [0.0, 0.0, 0.5]
  anomalies:
    - {center: [0.6, 0.7, 0.8], sigma: [0.22, 0.30, 0.25], amplitude: -0.35}
    - {center: [1.4, 1.2, 1.3], sigma: [0.30, 0.22, 0.28], amplitude: 0.45}
    - {center: [1.1, 0.4, 1.6], sigma: [0.18, 0.25, 0.20], amplitude: -0.20}
network:
  width: 40
  fourier: {enabled: true, size: 32, scale: 1.0, include_raw: true}
training:
  iterations: 30000
  batch_size: 4096
  lbfgs: {enabled: true, iterations: 50, max_iter: 20, batch_size: 8192}
evaluation: {grid_size: 101, validation_grid_size: 31, batch_size: 16384, reference: fsm}
